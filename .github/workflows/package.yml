name: 📦 Συσκευασία Εφαρμογής & Installer

on:
  # 1. Χειροκίνητη εκτέλεση από το κουμπί "Run workflow" στο GitHub
  workflow_dispatch:
    inputs:
      version:
        description: 'Έκδοση εφαρμογής (π.χ. 1.0.0 - αφήστε κενό για αυτόματη ανάγνωση από version.py)'
        required: false
        default: ''
      create_release:
        description: 'Δημιουργία επίσημου GitHub Release;'
        type: boolean
        required: true
        default: true

  # 2. Αυτόματη εκτέλεση όταν ανεβαίνει νέο Git tag (π.χ. git push origin v1.0.0)
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    name: 🔨 Build & Package (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: 📥 Λήψη Κώδικα (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Εγκατάσταση Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Εγκατάσταση Εξαρτήσεων (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🏷️ Καθορισμός Έκδοσης (Version Detection & Hygiene)
        id: version_step
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          if ($inputVer -ne "") {
            $ver = $inputVer
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF.Substring(11) # αφαίρεση του refs/tags/v
          } else {
            # Ανάγνωση από το version.py
            $match = (Get-Content version.py | Select-String '__version__\s*=\s*"([^"]+)"')
            if ($match) {
              $ver = $match.Matches.Groups[1].Value
            } else {
              $ver = "1.0.0"
            }
          }
          Write-Host ">>> Έκδοση προς συσκευασία: $ver"
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          "TAG_NAME=v$ver" >> $env:GITHUB_ENV

      - name: 🔨 Μεταγλώττιση με PyInstaller (Αυτόνομο Πακέτο)
        run: |
          pyinstaller --noconfirm --clean build.spec

      - name: 🗜️ Δημιουργία Φορητού Πακέτου (Portable ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_installer" -Force | Out-Null
          $zipPath = "dist_installer\Protocol_Portable_v$env:APP_VERSION.zip"
          Write-Host ">>> Δημιουργία Portable ZIP: $zipPath"
          Compress-Archive -Path "dist\Protokollo\*" -DestinationPath "$zipPath" -Force
          Copy-Item "$zipPath" "dist_installer\Protocol_Portable_Latest.zip" -Force

      - name: 🛠️ Εγκατάσταση Inno Setup 6
        run: |
          choco install innosetup --no-progress --no-color

      - name: 📦 Δημιουργία Windows Installer (.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host ">>> Εκτέλεση Inno Setup: $iscc"
          & "$iscc" /DMyAppVersion="$env:APP_VERSION" installer.iss
          Copy-Item "dist_installer\Protocol_Setup_v$env:APP_VERSION.exe" "dist_installer\Protocol_Setup_Latest.exe" -Force

      - name: 💾 Αποθήκευση Πακέτων ως Artifacts (Installer & Portable)
        uses: actions/upload-artifact@v4
        with:
          name: Protocol_Packages_v${{ env.APP_VERSION }}
          path: |
            dist_installer/*.exe
            dist_installer/*.zip
          retention-days: 30

      - name: 🚀 Δημοσίευση GitHub Release (Διπλό Πακέτο)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "🏛️ Ηλεκτρονικό Πρωτόκολλο Εγγράφων v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist_installer/*.exe
            dist_installer/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
